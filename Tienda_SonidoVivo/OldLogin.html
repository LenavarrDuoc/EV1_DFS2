<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SonidoVivo</title>
    
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body id="login">
    <main-header></main-header>

    <form id="formulario">
        <fieldset class="grid-formulario">
            <legend class="legend-titulo-fieldset">Ingrese datos de inicio de sesión: </legend>
            <div class="campo">
                <label for="correo">Correo E: </label>
                <input type="email" id="correo" name="correo" placeholder="ej: usuario@dominio.com" required>
            </div>
            <div class="campo">
                <password-input input-id="contrasena" name="contrasena" placeholder="Ingrese su contraseña" required></password-input>
            </div>
            <div class="campo">
                <button type="submit" id="btn-iniciar-sesion">Iniciar Sesión</button>
            </div>
            <br>
            <br>
            <div>
                <label>Aún no estoy registrado:</label>
            </div>
            <button type="button" id="btn-ir-registro">Registrarse</button>
        </fieldset>
    </form>

    <main-footer></main-footer>
</body>
</html>
